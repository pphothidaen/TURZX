[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turzx"
version = "1.0.0"
description = "Universal Python driver and CLI for TURZX / Turing Smart Screen USB-C secondary displays"
readme = "README.md"
authors = [{ name = "TURZX Developer" }]
license = "MIT"
keywords = ["turzx", "turing", "usb-monitor", "ch340", "secondary-display", "lcd"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.10"
dependencies = [
    "pyusb>=1.2.0",
    "pyserial>=3.5",
    "pillow>=9.0.0",
    "numpy>=1.20.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "flake8>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
turzx = "turzx.cli:main"
turxz-scheduler = "turxz_scheduled_jobs.cli:main"

[project.urls]
Homepage = "https://github.com/kimlenglim/TURZX"
Documentation = "https://github.com/kimlenglim/TURZX/blob/main/docs/ARCHITECTURE_AND_PROTOCOL.md"

[tool.setuptools.packages.find]
include = ["turzx*", "turxz_scheduled_jobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "backend",
    "session_bridge.py",
    "diag_serial.py",
    "health.py",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E722", "F401", "F841"]
